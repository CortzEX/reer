name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          cl /EHsc /std:c++17 /O2 main.cpp /Fe:MyLoader.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MyLoader
          path: MyLoader.exe
